<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetPulse - Technician Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .card-bg { background-color: #111827; border: 1px solid #1f2937; }
        .modal-bg { background-color: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6 max-w-5xl mx-auto font-sans">
    
    <!-- Header Bar -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-800">
        <div>
            <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-user-gear text-indigo-400"></i> TECHNICIAN WORKBENCH
            </h1>
            <p id="activeTechSubHeader" class="text-xs text-gray-400">Please log in to view assigned queue</p>
        </div>
        
        <div id="techHeaderControls" class="hidden flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-400">Duty Status:</span>
                <select id="techDutySelect" onchange="toggleDuty(this.value)" class="bg-gray-800 border border-gray-700 text-xs text-white rounded p-1.5 focus:outline-none">
                    <option value="ACTIVE">🟢 Active on Duty</option>
                    <option value="OUT_OF_OFFICE">🟡 Out of Office</option>
                    <option value="ON_LEAVE">🔴 On Leave</option>
                </select>
            </div>
            <button onclick="logoutTech()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold rounded border border-gray-700 flex items-center gap-1">
                <i class="fa-solid fa-right-from-bracket"></i> Switch Profile
            </button>
        </div>
    </div>

    <!-- Assigned Incidents List -->
    <div class="space-y-4">
        <h2 id="queueTitle" class="text-sm font-bold uppercase text-gray-400 tracking-wider">Your Assigned Endpoint Incidents</h2>
        <div id="assigned-list" class="space-y-4"></div>
    </div>

    <!-- TECHNICIAN LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50">
        <div class="card-bg rounded-xl max-w-md w-full p-6 shadow-2xl border border-gray-700">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-indigo-500/30">
                    <i class="fa-solid fa-id-badge"></i>
                </div>
                <h3 class="text-xl font-bold text-white">Technician Workspace Login</h3>
                <p class="text-xs text-gray-400 mt-1">Select your profile to view assigned dispatch queue</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Select Onboarded Technician</label>
                    <select id="techSelectDropdown" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-indigo-500"></select>
                </div>

                <button onclick="loginAsTech()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-lg shadow-lg transition">
                    Access Workspace
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentTech = localStorage.getItem('fleetpulse_active_tech') || null;
        let allTechs = [];

        async function initPortal() {
            const res = await fetch('/api/techs');
            const data = await res.json();
            allTechs = data.techs;

            const dropdown = document.getElementById('techSelectDropdown');
            dropdown.innerHTML = '';
            
            if (allTechs.length === 0) {
                dropdown.innerHTML = '<option value="">No technicians onboarded</option>';
            } else {
                allTechs.forEach(t => {
                    dropdown.innerHTML += `<option value="${t.name}">${t.name} (${t.email})</option>`;
                });
            }

            if (currentTech && allTechs.some(t => t.name === currentTech)) {
                setupWorkspace();
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        }

        function loginAsTech() {
            const selected = document.getElementById('techSelectDropdown').value;
            if (!selected) return;
            currentTech = selected;
            localStorage.setItem('fleetpulse_active_tech', currentTech);
            document.getElementById('loginModal').classList.add('hidden');
            setupWorkspace();
        }

        function logoutTech() {
            localStorage.removeItem('fleetpulse_active_tech');
            currentTech = null;
            document.getElementById('techHeaderControls').classList.add('hidden');
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('assigned-list').innerHTML = '';
        }

        function setupWorkspace() {
            const techObj = allTechs.find(t => t.name === currentTech);
            document.getElementById('activeTechSubHeader').innerText = `Logged in as ${currentTech} (${techObj ? techObj.email : ''})`;
            document.getElementById('queueTitle').innerText = `${currentTech}'s Assigned Endpoint Incidents`;
            
            if (techObj) {
                document.getElementById('techDutySelect').value = techObj.status;
            }
            
            document.getElementById('techHeaderControls').classList.remove('hidden');
            loadAssigned();
        }

        async function toggleDuty(status) {
            const techObj = allTechs.find(t => t.name === currentTech);
            if (!techObj) return;

            await fetch(`/api/techs/duty/${techObj.id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            loadAssigned();
        }

        async function loadAssigned() {
            if (!currentTech) return;
            
            const res = await fetch('/api/fleet/devices');
            const data = await res.json();
            const container = document.getElementById('assigned-list');
            container.innerHTML = '';

            // Filter strictly for incidents assigned to THIS technician
            const assigned = data.devices.filter(d => d.assigned_tech === currentTech);

            if (assigned.length === 0) {
                container.innerHTML = `<div class="p-8 text-center card-bg rounded-xl text-gray-500 text-sm">No active incidents currently assigned to ${currentTech}!</div>`;
                return;
            }

            assigned.forEach(d => {
                const userFull = d.user_details.full_name || d.logged_user || 'Unassigned';
                const userEmail = d.user_details.email || `${d.logged_user}@company.com`;
                
                container.innerHTML += `
                    <div class="card-bg p-5 rounded-xl space-y-4">
                        <div class="flex justify-between items-start border-b border-gray-800 pb-3">
                            <div>
                                <h3 class="text-lg font-bold text-white">${d.hostname} <span class="text-sm font-normal text-gray-400">(${userFull})</span></h3>
                                <p class="text-xs text-gray-500">Target IP Address: ${d.ip_address}</p>
                            </div>
                            <span class="px-2.5 py-1 text-xs font-bold rounded ${d.status === 'RED' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                ${d.status === 'RED' ? 'CRITICAL / LAG' : 'WARNING'}
                            </span>
                        </div>

                        <div class="grid grid-cols-2 gap-4 text-xs">
                            <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
                                <p class="font-bold text-indigo-400 mb-2">System & Hardware Specs</p>
                                <p class="text-gray-300">• OS Build: ${d.os_info.product_name || 'Windows'} (Build ${d.os_info.build_number || '22631'})</p>
                                <p class="text-gray-300">• Pending Updates: <span class="font-bold ${d.update_info.pending_updates_count > 0 ? 'text-red-400' : 'text-emerald-400'}">${d.update_info.pending_updates_count || 0} updates</span></p>
                                <p class="text-gray-300">• Free Disk Space: ${d.hardware_info.free_disk_gb || 'N/A'} GB</p>
                            </div>

                            <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
                                <p class="font-bold text-indigo-400 mb-2">User Profile & Comms</p>
                                <p class="text-gray-300">• Email: <a href="mailto:${userEmail}" class="text-indigo-400 hover:underline">${userEmail}</a></p>
                                <div class="mt-3 flex gap-2">
                                    <a href="mailto:${userEmail}?subject=FleetPulse%20IT%20Support" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-indigo-300 text-xs rounded border border-gray-700 flex items-center gap-1">
                                        <i class="fa-solid fa-envelope"></i> Email User
                                    </a>
                                    <a href="https://teams.microsoft.com/l/chat/0/0?users=${userEmail}" target="_blank" class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-indigo-300 text-xs rounded border border-gray-700 flex items-center gap-1">
                                        <i class="fa-solid fa-comments"></i> Teams Chat
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Instant Remediation Bar -->
                        <div class="pt-2 flex justify-between items-center border-t border-gray-800">
                            <div class="flex gap-2">
                                <button onclick="sendCmd('${d.hostname}', 'flushdns')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 rounded border border-gray-700">🧹 Flush DNS</button>
                                <button onclick="sendCmd('${d.hostname}', 'restart_wuauserv')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 rounded border border-gray-700">🔄 Restart WU</button>
                            </div>
                            <button onclick="remediate('${d.hostname}')" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded shadow flex items-center gap-1">
                                <i class="fa-solid fa-check"></i> Mark Remediated
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        async function sendCmd(hostname, cmd) {
            await fetch('/api/admin/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hostname, command: cmd })
            });
            alert(`Command '${cmd}' queued for ${hostname}`);
        }

        async function remediate(hostname) {
            await fetch(`/api/admin/remediate/${hostname}`, { method: 'POST' });
            loadAssigned();
        }

        initPortal();
        setInterval(loadAssigned, 10000);
    </script>
</body>
</html>
