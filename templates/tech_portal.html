<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetPulse - Technician Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1329; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .glass-card { background: rgba(23, 32, 54, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(51, 65, 85, 0.6); }
        .pulse-red { box-shadow: 0 0 8px #ef4444; }
        .pulse-amber { box-shadow: 0 0 8px #f59e0b; }
        .pulse-purple { box-shadow: 0 0 8px #a855f7; }
    </style>
</head>
<body class="p-6">
    <!-- LOGIN OVERLAY MODAL -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="glass-card rounded-2xl max-w-md w-full p-8 border border-slate-700 shadow-2xl space-y-6 text-center">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">FLEET<span class="text-slate-100">PULSE</span> TECH DESK</h1>
                <p class="text-xs text-slate-400 mt-1">Select your technician profile to access your assigned queue</p>
            </div>
            
            <div class="space-y-3 text-left">
                <label class="text-xs text-slate-400 font-bold uppercase tracking-wider">Technician Profile</label>
                <select id="tech-login-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-sky-300 font-bold focus:outline-none focus:border-sky-500">
                    <!-- Populated via JS -->
                </select>
            </div>

            <button onclick="loginTechnician()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm rounded-lg shadow-lg transition">
                🚀 Access My Assigned Workload
            </button>
        </div>
    </div>

    <!-- MAIN TECH DASHBOARD -->
    <div id="tech-dashboard" class="hidden">
        <!-- Header -->
        <header class="flex justify-between items-center pb-6 mb-6 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">FLEET<span class="text-slate-100">PULSE</span> TECHNICIAN DESK</h1>
                <p class="text-xs text-slate-400">Logged in as: <strong id="logged-tech-name" class="text-sky-300"></strong> (<span id="logged-tech-role" class="text-slate-400"></span>)</p>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-xs">
                    <span class="text-slate-400">Shift Status:</span>
                    <select id="my-status-select" onchange="updateMyStatus(this.value)" class="bg-slate-800 text-emerald-400 font-bold rounded px-2 py-0.5 border border-slate-700">
                        <option value="ON_DUTY">On Duty</option>
                        <option value="OFF_DUTY">Off Duty</option>
                        <option value="ON_LEAVE">On Leave</option>
                    </select>
                </div>
                <button onclick="logoutTechnician()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded border border-slate-700 transition">Switch Tech</button>
                <button onclick="fetchMyQueue()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-xs font-semibold rounded text-white transition flex items-center space-x-1">
                    <span>↻ Refresh Queue</span>
                </button>
            </div>
        </header>

        <!-- ASSIGNED WORKLOAD QUEUE -->
        <main class="space-y-6">
            <div class="flex justify-between items-center bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                <h2 class="text-sm font-bold text-slate-200">📋 My Assigned Repair Queue</h2>
                <span id="my-task-count" class="text-xs bg-sky-950 text-sky-300 border border-sky-800 px-3 py-1 rounded-full font-bold">0 Tasks Pending</span>
            </div>

            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 divide-y divide-slate-800/80" id="my-task-list">
                <div class="text-slate-500 text-xs italic p-2">Loading assigned machines...</div>
            </div>
        </main>
    </div>

    <!-- REMEDIATION MODAL -->
    <div id="action-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="glass-card rounded-xl max-w-lg w-full p-6 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <div>
                    <h3 id="modal-hostname" class="text-lg font-bold text-sky-400">PC Remediate</h3>
                    <p id="modal-ip" class="text-xs text-slate-400 font-mono"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">&times;</button>
            </div>
            
            <div id="modal-alert" class="hidden mb-3 p-2 bg-emerald-950 border border-emerald-700 text-emerald-300 text-xs rounded text-center font-bold"></div>
            <div id="modal-body" class="space-y-4 text-sm text-slate-300"></div>

            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded">Close</button>
            </div>
        </div>
    </div>

    <script>
        let CURRENT_TECH = null;

        async function loadTechProfiles() {
            const res = await fetch('/api/techs');
            const data = await res.json();
            const select = document.getElementById('tech-login-select');
            select.innerHTML = '';
            
            data.techs.forEach(t => {
                select.innerHTML += `<option value='${JSON.stringify(t)}'>${t.name} (${t.role}) - ${t.status.replace('_', ' ')}</option>`;
            });
        }

        function loginTechnician() {
            const raw = document.getElementById('tech-login-select').value;
            if (!raw) return;
            
            CURRENT_TECH = JSON.parse(raw);
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('tech-dashboard').classList.remove('hidden');
            document.getElementById('logged-tech-name').innerText = CURRENT_TECH.name;
            document.getElementById('logged-tech-role').innerText = CURRENT_TECH.role;
            document.getElementById('my-status-select').value = CURRENT_TECH.status;

            fetchMyQueue();
        }

        function logoutTechnician() {
            CURRENT_TECH = null;
            document.getElementById('tech-dashboard').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('hidden');
            loadTechProfiles();
        }

        async function updateMyStatus(newStatus) {
            if (!CURRENT_TECH) return;
            await fetch(`/api/techs/duty/${CURRENT_TECH.id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            CURRENT_TECH.status = newStatus;
            fetchMyQueue();
        }

        async function fetchMyQueue() {
            if (!CURRENT_TECH) return;

            const res = await fetch('/api/fleet/devices');
            const data = await res.json();
            
            // Filter strictly for machines assigned to THIS technician
            const myTasks = data.devices.filter(d => d.assigned_tech === CURRENT_TECH.name && d.status !== 'GREEN');
            
            document.getElementById('my-task-count').innerText = `${myTasks.length} Tasks Pending`;
            const container = document.getElementById('my-task-list');
            container.innerHTML = '';

            if (myTasks.length === 0) {
                container.innerHTML = `<div class="text-emerald-400 text-xs italic p-4 text-center">🎉 No pending issues assigned to you! Your queue is completely clean.</div>`;
                return;
            }

            myTasks.forEach(dev => {
                let badge = '';
                let pulse = '';
                if (dev.status === 'RED') { badge = '<span class="px-2 py-0.5 bg-rose-950 text-rose-300 border border-rose-800 rounded font-bold">CRITICAL</span>'; pulse = 'pulse-red bg-rose-500'; }
                else if (dev.status === 'AMBER') { badge = '<span class="px-2 py-0.5 bg-amber-950 text-amber-300 border border-amber-800 rounded font-bold">UPDATES PENDING</span>'; pulse = 'pulse-amber bg-amber-500'; }
                else { badge = '<span class="px-2 py-0.5 bg-purple-950 text-purple-300 border border-purple-800 rounded font-bold">NETWORK DROP</span>'; pulse = 'pulse-purple bg-purple-500'; }

                container.innerHTML += `
                    <div onclick='openActionModal(${JSON.stringify(dev)})' class="flex justify-between items-center py-3 px-3 hover:bg-slate-800/60 rounded-lg cursor-pointer transition text-xs">
                        <div class="flex items-center space-x-3">
                            <span class="w-2.5 h-2.5 rounded-full ${pulse}"></span>
                            <span class="font-bold text-slate-100">${dev.hostname}</span>
                            <span class="text-sky-400 font-mono">(${dev.ip_address})</span>
                            <span class="text-slate-400">• ${dev.user_details.full_name} (${dev.user_details.department})</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            ${badge}
                            <span class="text-slate-400">Ext: ${dev.user_details.phone_ext}</span>
                            <span class="text-sky-400 hover:text-sky-300 font-semibold">Inspect & Fix ➔</span>
                        </div>
                    </div>
                `;
            });
        }

        async function remediateHost(hostname) {
            await fetch(`/api/admin/remediate/${hostname}`, { method: 'POST' });
            const alert = document.getElementById('modal-alert');
            alert.classList.remove('hidden');
            alert.innerText = `[REMEDIATED] ${hostname} marked as resolved! Removing from your queue...`;
            setTimeout(() => {
                closeModal();
                fetchMyQueue();
            }, 1000);
        }

        async function triggerCommand(hostname, command) {
            await fetch('/api/admin/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hostname: hostname, command: command })
            });
            const alert = document.getElementById('modal-alert');
            alert.classList.remove('hidden');
            alert.innerText = `[QUEUED] Command '${command}' dispatched...`;
        }

        async function launchRDPSession(ipAddress) {
            const res = await fetch('/api/admin/launch-rdp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip: ipAddress })
            });
            const data = await res.json();
            const alert = document.getElementById('modal-alert');
            alert.classList.remove('hidden');
            if (data.status === 'SUCCESS') alert.innerText = `[RDP LAUNCHED] Connecting to ${ipAddress}...`;
            else alert.innerText = `[RDP ERROR] ${data.message}`;
        }

        function openActionModal(dev) {
            document.getElementById('action-modal').classList.remove('hidden');
            document.getElementById('modal-alert').classList.add('hidden');
            document.getElementById('modal-hostname').innerText = `${dev.hostname} (${dev.user_details.full_name})`;
            document.getElementById('modal-ip').innerText = `Target IP Address: ${dev.ip_address}`;
            
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <div class="p-3 bg-slate-900 rounded-lg space-y-1.5 text-xs border border-slate-800">
                    <div class="font-bold text-sky-400">System & Hardware Specs</div>
                    <div>• OS Build: ${dev.os_info.product_name} ${dev.os_info.display_version} (Build ${dev.os_info.build_number})</div>
                    <div>• Pending Updates: <span class="${dev.update_info.pending_updates_count > 5 ? 'text-rose-400 font-bold' : 'text-amber-300'}">${dev.update_info.pending_updates_count} updates</span></div>
                    <div>• Free Disk Space: ${dev.hardware_info.free_disk_gb} GB</div>
                </div>

                <div class="p-3 bg-slate-900 rounded-lg space-y-1.5 text-xs border border-slate-800">
                    <div class="font-bold text-sky-400">Active Directory Profile</div>
                    <div>• Email: <a href="mailto:${dev.user_details.email}" class="text-sky-300 underline">${dev.user_details.email}</a></div>
                    <div>• IP Phone Extension: <span class="text-emerald-400 font-mono font-bold">${dev.user_details.phone_ext}</span></div>
                    <div>• Department: ${dev.user_details.department}</div>
                </div>

                <div class="p-3 bg-slate-900 rounded-lg space-y-2 text-xs border border-slate-800">
                    <div class="font-bold text-sky-400 mb-1">Instant IT Remediation Commands</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="triggerCommand('${dev.hostname}', 'FLUSH_DNS')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded border border-slate-700 transition">🧹 Flush DNS Cache</button>
                        <button onclick="triggerCommand('${dev.hostname}', 'RESTART_WUAUSERV')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded border border-slate-700 transition">🔄 Restart WU Service</button>
                        <button onclick="triggerCommand('${dev.hostname}', 'CHECK_UPDATES')" class="p-2 bg-sky-900 hover:bg-sky-800 text-sky-200 text-xs font-semibold rounded border border-sky-700 col-span-2 transition">🚀 Force Windows Update Scan</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="launchRDPSession('${dev.ip_address}')" class="py-2.5 bg-emerald-800 hover:bg-emerald-700 text-white font-bold text-xs rounded border border-emerald-600 transition flex items-center justify-center space-x-1">
                        <span>🖥️ RDP Session</span>
                    </button>
                    <button onclick="remediateHost('${dev.hostname}')" class="py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded border border-sky-400 transition flex items-center justify-center space-x-1">
                        <span>✅ Resolve Issue</span>
                    </button>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('action-modal').classList.add('hidden');
        }

        loadTechProfiles();
        setInterval(fetchMyQueue, 5000);
    </script>
</body>
</html>
